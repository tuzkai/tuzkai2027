kind = "web"
previewPath = "/tuzakai/"
title = "TuzakAI Jewelry Designer by Sztuzk"
description = "A jewelry design assistant for planning components, visual concepts, making steps, costs and prices."
version = "1.0.0"
id = "artifacts/tuzakai-jewelry-designer"
router = "path"

[[services]]
name = "web"
paths = [ "/tuzakai/" ]
localPort = 23466

[services.development]
run = "pnpm --filter @workspace/tuzakai-jewelry-designer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tuzakai-jewelry-designer", "run", "build" ]
serve = "static"
publicDir = "artifacts/tuzakai-jewelry-designer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23466"
BASE_PATH = "/tuzakai/"
