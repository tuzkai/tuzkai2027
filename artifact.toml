kind = "web"
previewPath = "/"
title = "TuzakAI by Sztuzk"
description = "AI tools and digital products for creative entrepreneurs, with a jewelry designer and practical legacy Studio tools."
version = "1.0.0"
id = "artifacts/sztuzk-jewelry-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25557

[services.development]
run = "pnpm --filter @workspace/sztuzk-jewelry-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sztuzk-jewelry-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/sztuzk-jewelry-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25557"
BASE_PATH = "/"
